<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update MAC Address</title>
    <link rel="stylesheet" href="/src/styles/style.css">
</head>
<body>
    <h1>Update MAC Address</h1>
    <div class="container">
        <form id="update-form">
            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Name" required>
            <label for="old-mac">Current MAC Address:</label>
            <input type="text" id="old-mac" placeholder="XX:XX:XX:XX:XX:XX" required>
            <label for="new-mac">New MAC Address:</label>
            <input type="text" id="new-mac" placeholder="XX:XX:XX:XX:XX:XX" required>
            <button type="submit">Update MAC Address</button>
            <p><a href="./indext.html">Back to Login</a></p>
        </form>
    </div>
    <script src="/src/bundle.js"></script>
</body>
</html>
