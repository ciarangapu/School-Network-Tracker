<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <h1>Admin Login</h1>
    <div class="container"> 
        <form id="admin-login-form">     
            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Name" required>
            <label for="login-mac">MAC Address:</label>
            <input type="text" id="login-mac" placeholder="XX:XX:XX:XX:XX:XX" required>
            <label class="custom-checkbox">
                <input type="checkbox" id="remember" name="remember">
                Remember me
            </label>
            <button type="submit">Login</button>
            <p>Student Login? <a href="./indext.html">Student Login</a></p>
            <p>Don't have an account? <a href="./indext2.html">Register</a></p>
        </form>
    </div>
    <script src="./bundle.js"></script>
</body>
</html>
