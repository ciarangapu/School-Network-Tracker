<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>
    <link rel="stylesheet" href="/src/styles/style.css">
</head>
<body>
  <h1>Welcome To Students Login</h1>
    <div class="container"> 
        <form id="login-form">     
            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Name" required>
            <label for="login-mac">MAC Address:</label>
            <input type="text" id="login-mac" placeholder="XX:XX:XX:XX:XX:XX" required>
            <label class="custom-checkbox">
                <input type="checkbox" id="remember" name="remember">
                Remember me
            </label>
                     <!-- <select id="role" name="role" --required onchange="if(this.value === 'admin') window.location.href='admin.html';">
                <option value="user"> <a href="./indext.html"></a>Student</option>
                <option value="admin"><a href="./admin.html"></a>Admin</option>
            </select> -->
            <button type="submit" onclick="window.location.href='userdashboard.html'">Login</button>
            <button type="button" onclick="window.location.href='update.html'">Forgotten MAC Address</button>
            <p>Don't have an account? <a href="./indext2.html">Register.</a></p>
            <p><a href="./users.html">View Registered Students</a></p>
        </form>
    </div>
    <script src="/src/bundle.js"></script>
</body>
</html>
