<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login</title>
    <link rel="stylesheet" href="/src/styles/style.css">
</head>
<body>
  <h1>Welcome To Students Login</h1>
    <div class="container"> 
        <form id="login-form">     
            <label for="name">Name:</label>
            <input type="text" id="name" placeholder="Name" required>
            <label for="login-mac">MAC Address:</label>
            <input type="text" id="login-mac" placeholder="XX:XX:XX:XX:XX:XX" required>
            <label class="custom-checkbox">
                <input type="checkbox" id="remember" name="remember">
                Remember me
            </label>
            <button type="submit">Login</button>
            <button type="button" onclick="window.location.href='update.html'">Forgotten MAC Address</button>
            <p>Don't have an account? <a href="./registration.html">Register.</a></p>
            <p><a href="./users.html">View Registered Students</a></p>
                        <p><a href="./landing.html">Back to Home</a></p>

        </form>
    </div>
    <script type="module" src="index.js"></script>
</body>
</html>
